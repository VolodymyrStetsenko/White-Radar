[app]
database_path = "data/white-radar.sqlite3"
watchlist_path = "watchlist.toml"
poll_interval_seconds = 20
request_timeout_seconds = 20
request_retries = 3
log_level = "INFO"
dry_run = true

[telegram]
enabled = false
minimum_score = 60
send_testnet_alerts = false

[enrichment]
sourcify_enabled = true
etherscan_enabled = true

# Confirmed-block scanners are read-only. A chain with a missing RPC variable is skipped.
[[chains]]
name = "ethereum"
display_name = "Ethereum"
chain_id = 1
enabled = true
is_testnet = false
rpc_http_env = "RPC_ETHEREUM_HTTP"
rpc_ws_env = "RPC_ETHEREUM_WS"
explorer_url = "https://etherscan.io"
confirmations = 3
initial_lookback_blocks = 3
max_blocks_per_cycle = 12
monitor_global_upgrades = false

